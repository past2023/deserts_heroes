<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desert's Heroes — Time Rift</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030b}body{display:flex;align-items:center;justify-content:center}canvas{image-rendering:pixelated;image-rendering:crisp-edges}
