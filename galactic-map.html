<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert's Heroes — Galactic Mission Map</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.65) inset; background:#02040c; }
  @font-face { font-family:'Press Start 2P'; src:url('assets/fonts/PressStart2P-Regular.ttf') format('truetype'); font-weight:normal; font-style:normal; font-display:block; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; box-shadow:0 0 50px #07152b; }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#68efff; background:#02040c; z-index:5; }
  #loading-bar-wrap { width:320px; height:24px; margin-top:0; border:4px solid #68efff; background:#020306; border-radius:0; overflow:hidden; box-shadow:4px 4px 0 #000,0 0 0 3px rgba(0,0,0,.7) inset; image-rendering:pixelated; }
  #loading-bar { width:0%; height:100%; background:#68efff; transition:width 0.22s steps(16,end); box-shadow:inset 0 0 0 3px rgba(0,0,0,.38); }
  #loading-title canvas { display:block; margin:0 auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  #loading-title { margin-bottom:8px; }
</style>
</head>
<body>
<div id="loading">
  <div id="loading-title"></div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>
<canvas id="galactic-map" width="960" height="540"></canvas>
<script>document.fonts.load('16px "Press Start 2P"').catch(function(){});</script>
<script src="js/pixel-font.js"></script>
<script>
(function(){
  var bar=document.getElementById('loading-bar'),titleEl=document.getElementById('loading-title'),p=0;
  var PAF=window.PixelAlienFont;
  var titlePx=PAF.install(titleEl,'#68efff');
  var textIv=setInterval(function(){titlePx.update(PAF.randomLine(5))},50);
  var iv=setInterval(function(){p+=0.05+Math.random()*0.06;if(p>1)p=1;bar.style.width=Math.round(p*100)+'%';if(p>=1){setTimeout(function(){clearInterval(textIv);var el=document.getElementById('loading');if(el)el.style.display='none'},300);clearInterval(iv)}},150);
})();
</script>
<script src="js/music-tracks.js"></script>
<script src="js/galactic-map.js"></script>
</body>
</html>
