<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert's Heroes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a12;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 60px rgba(255, 140, 0, 0.15);
  }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffb347; font: bold 16px 'Courier New', monospace; letter-spacing:2px; text-shadow:2px 0 #123,0 2px #123,0 0 10px currentColor; image-rendering:pixelated; background: #0a0a12; z-index: 5; }
  #loading-bar-wrap { width: 280px; height: 18px; margin-top: 18px; border: 2px solid #ffb347; background: #1a140a; border-radius: 2px; overflow: hidden; box-shadow:0 0 0 2px rgba(0,0,0,.65) inset; }
  #loading-bar { width: 0%; height: 100%; background: repeating-linear-gradient(90deg,#ffb347 0 10px,#ffe28a 10px 14px,#7a3d18 14px 16px); transition: width 0.25s steps(8,end); }
  #loading-label { margin-top: 10px; font-size: 11px; color: #c08840; }
</style>
</head>
<body>
<div id="loading">
  <div id="loading-title">⟟⌁⟁ ▰◈⋔ ⌬⍜⟊</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-label">◬⟐⌁⋔⟁⟊</div>
</div>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script src="js/content.js"></script>
<script src="js/i18n.js"></script>
<script src="js/characters.js"></script>
<script src="js/character-assets.js"></script>
<script src="js/vehicle-assets.js"></script>
<script src="js/music-tracks.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/combat-fx.js"></script>
<script src="js/level.js"></script>
<script src="js/desert-weather.js"></script>
<script src="js/foreground-decor.js"></script>
<script src="js/extreme-foreground.js"></script>
<script src="js/entity-utils.js"></script>
<script src="js/entity-score.js"></script>
<script src="js/entity-collectibles.js"></script>
<script src="js/entity-warnings.js"></script>
<script src="js/entity-props.js"></script>
<script src="js/entities.js"></script>
<script src="js/retro-filter.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/settings.js"></script>
<script src="js/game.js"></script>
<script>
(function(){
  var bar = document.getElementById('loading-bar');
  var label = document.getElementById('loading-label');
  var title = document.getElementById('loading-title');
  var glyphs = '⟟⟁⌁⌬⍜⟊◬◈▰▱⋔⋇⟐⌯⌑◌';
  var steps = [0.10, 0.30, 0.55, 0.78, 0.95];
  var stepIdx = 0;
  var progress = 0;
  function alienLine(len){
    var out = '';
    for (var i = 0; i < len; i++) out += glyphs[(Math.random() * glyphs.length) | 0];
    return out;
  }
  var interval = setInterval(function(){
    progress += 0.02 + Math.random() * 0.03;
    if (progress > 1) progress = 1;
    bar.style.width = Math.round(progress * 100) + '%';
    title.textContent = alienLine(4) + ' ▰ ' + alienLine(6);
    label.textContent = alienLine(10 + ((progress * 8) | 0));
    while (stepIdx < steps.length && progress >= steps[stepIdx]) stepIdx++;
    if (progress >= 1) {
      setTimeout(function(){
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, 400);
      clearInterval(interval);
    }
  }, 180);
})();

window.addEventListener('load', function(){
  setTimeout(function(){
    var el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }, 1800);
});
window.addEventListener('player-assets-ready', function(){
  var el = document.getElementById('loading');
  if (el) el.style.display = 'none';
});
</script>
</body>
</html>
