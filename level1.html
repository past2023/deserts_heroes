<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert's Heroes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face { font-family:'Press Start 2P'; src:url('assets/fonts/PressStart2P-Regular.ttf') format('truetype'); font-weight:normal; font-style:normal; font-display:block; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Press Start 2P', "Courier New", monospace;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 60px rgba(255, 140, 0, 0.15);
  }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffb347; background: #05070d; z-index: 5; }
  #loading-bar-wrap { width: 320px; height: 24px; margin-top: 0; border: 4px solid #ffb347; background: #020306; border-radius: 0; overflow: hidden; box-shadow: 4px 4px 0 #000, 0 0 0 3px rgba(0,0,0,.7) inset; image-rendering: pixelated; }
  #loading-bar { width: 0%; height: 100%; background: #ffb347; transition: width 0.22s steps(16,end); box-shadow: inset 0 0 0 3px rgba(0,0,0,.38); }
  #loading-title canvas, #loading-label canvas { display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  #loading-title { margin-bottom: 8px; }
  #loading-label { margin-top: 10px; }
</style>
</head>
<body>
<div id="loading">
  <div id="loading-title"></div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-label"></div>
</div>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>document.fonts.load('16px "Press Start 2P"').catch(function(){});</script>
<script src="js/pixel-font.js"></script>
<script src="js/content.js"></script>
<script src="js/i18n.js"></script>
<script src="js/characters.js"></script>
<script src="js/character-assets.js"></script>
<script src="js/vehicle-assets.js"></script>
<script src="js/music-tracks.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/combat-fx.js"></script>
<script src="js/level.js"></script>
<script src="js/desert-weather.js"></script>
<script src="js/foreground-decor.js"></script>
<script src="js/extreme-foreground.js"></script>
<script src="js/entity-utils.js"></script>
<script src="js/entity-score.js"></script>
<script src="js/entity-collectibles.js"></script>
<script src="js/entity-warnings.js"></script>
<script src="js/entity-props.js"></script>
  <script src="js/spider-tank.js"></script>
  <script src="js/entities.js"></script>
<script src="js/retro-filter.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/settings.js"></script>
<script src="js/game.js"></script>
<script>
(function(){
  var bar = document.getElementById('loading-bar');
  var titleEl = document.getElementById('loading-title');
  var labelEl = document.getElementById('loading-label');
  var PAF = window.PixelAlienFont;
  var titlePx = PAF.install(titleEl, '#ffb347');
  var labelPx = PAF.install(labelEl, '#c08840');
  var steps = [0.10, 0.30, 0.55, 0.78, 0.95];
  var stepIdx = 0;
  var progress = 0;
  var textIv = setInterval(function(){
    titlePx.update(PAF.randomLine(4));
    labelPx.update(PAF.randomLine(6 + ((progress * 5) | 0)));
  }, 50);
  var interval = setInterval(function(){
    progress += 0.02 + Math.random() * 0.03;
    if (progress > 1) progress = 1;
    bar.style.width = Math.round(progress * 100) + '%';
    while (stepIdx < steps.length && progress >= steps[stepIdx]) stepIdx++;
    if (progress >= 1) {
      setTimeout(function(){
        clearInterval(textIv);
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, 400);
      clearInterval(interval);
    }
  }, 180);
})();

window.addEventListener('load', function(){
  setTimeout(function(){
    var el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }, 1800);
});
window.addEventListener('player-assets-ready', function(){
  var el = document.getElementById('loading');
  if (el) el.style.display = 'none';
});
</script>
</body>
</html>
