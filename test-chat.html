<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test Chat Beep</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #0f0; }
  canvas { border: 1px solid #333; display: block; margin-bottom: 16px; cursor: pointer; }
  #log { width: 960px; height: 140px; overflow-y: auto; background: #111; border: 1px solid #333; padding: 8px; font-size: 12px; line-height: 1.6; color: #0f0; }
  .log-line { margin-bottom: 2px; }
  .log-time { color: #666; }
  .log-ally { color: #68efff; }
  .log-enemy { color: #ff4444; }
  .log-sfx { color: #ffaa00; }
  .log-err { color: #ff0000; font-weight: bold; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="log"></div>

<script src="js/audio.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var g = canvas.getContext('2d');
  var logEl = document.getElementById('log');

  var VW = 960, VH = 540;
  var GROUND = 430;
  var GRAV = 2200;
  var SPEED = 270;
  var JUMP = -780;

  var px = VW / 2, py = GROUND, pvx = 0, pvy = 0, onGround = true;
  var facing = 1;

  var chatMsg = '';
  var chatSide = 'ally';
  var chatT = 0;
  var nextChat = 3;
  var chatTimer = 0;

  var allyHints = ['Roger that!', 'On my way!', 'Cover me!', 'Enemy spotted!'];
  var enemyTaunts = ['You cant win!', 'Prepare to die!', 'Run while you can!'];

  function log(text, cls) {
    var d = document.createElement('div');
    d.className = 'log-line ' + cls;
    var now = new Date().toLocaleTimeString();
    d.innerHTML = '<span class="log-time">[' + now + ']</span> ' + text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function triggerChat() {
    var isEnemy = Math.random() < 0.55;
    var pool = isEnemy ? enemyTaunts : allyHints;
    chatMsg = pool[Math.floor(Math.random() * pool.length)];
    chatSide = isEnemy ? 'enemy' : 'ally';
    chatT = 5;

    log('Chat: "' + chatMsg + '" (' + chatSide + ')', chatSide === 'ally' ? 'log-ally' : 'log-enemy');

    if (isEnemy) {
      if (SFX.enemyChatBeep) { SFX.enemyChatBeep(); log('SFX.enemyChatBeep() - 3 repeating beeps', 'log-sfx'); }
      else { log('SFX.enemyChatBeep is UNDEFINED!', 'log-err'); }
    } else {
      if (SFX.chatBeep) { SFX.chatBeep(); log('SFX.chatBeep() - 4 repeating beeps', 'log-sfx'); }
      else { log('SFX.chatBeep is UNDEFINED!', 'log-err'); }
    }
  }

  var keys = {};
  document.addEventListener('keydown', function (e) {
    keys[e.key] = true;

    if (e.key === '1') { log('Direct SFX.chatBeep()', 'log-sfx'); if (SFX.chatBeep) SFX.chatBeep(); else log('UNDEFINED', 'log-err'); }
    if (e.key === '2') { log('Direct SFX.enemyChatBeep()', 'log-sfx'); if (SFX.enemyChatBeep) SFX.enemyChatBeep(); else log('UNDEFINED', 'log-err'); }
    if (e.key === '3') { log('Direct SFX.pickup()', 'log-sfx'); if (SFX.pickup) SFX.pickup(); else log('UNDEFINED', 'log-err'); }
    if (e.key === '4') { log('Direct SFX.coin()', 'log-sfx'); if (SFX.coin) SFX.coin(); else log('UNDEFINED', 'log-err'); }
    if (e.key === '5') { log('Direct SFX.coinLife()', 'log-sfx'); if (SFX.coinLife) SFX.coinLife(); else log('UNDEFINED', 'log-err'); }

    if (e.key === 'm' || e.key === 'M') {
      var now = SFX.isMuted();
      SFX.toggleMute();
      log('Mute toggled: was=' + now + ' now=' + SFX.isMuted(), 'log-sfx');
    }

    if (e.key === ' ') {
      e.preventDefault();
      if (onGround) { pvy = JUMP; onGround = false; }
    }
  });
  document.addEventListener('keyup', function (e) { keys[e.key] = false; });

  var lastTime = performance.now();

  function update(dt) {
    pvx = 0;
    if (keys['ArrowLeft'] || keys['a']) { pvx = -SPEED; facing = -1; }
    if (keys['ArrowRight'] || keys['d']) { pvx = SPEED; facing = 1; }

    if (!onGround) pvy += GRAV * dt;
    px += pvx * dt;
    py += pvy * dt;

    if (py >= GROUND) { py = GROUND; pvy = 0; onGround = true; }
    px = Math.max(20, Math.min(VW - 20, px));

    chatTimer += dt;
    if (chatT > 0) chatT -= dt;
    if (chatTimer >= nextChat) {
      chatTimer = 0;
      nextChat = 4 + Math.random() * 4;
      triggerChat();
    }
  }

  function draw() {
    g.fillStyle = '#87CEEB';
    g.fillRect(0, 0, VW, VH);

    g.fillStyle = '#c2a64e';
    g.fillRect(0, GROUND, VW, VH - GROUND);
    g.fillStyle = '#a08030';
    g.fillRect(0, GROUND, VW, 3);

    g.save();
    g.translate(px, py);
    g.scale(facing, 1);
    g.fillStyle = '#2563eb';
    g.fillRect(-12, -54, 24, 40);
    g.fillStyle = '#fbbf24';
    g.fillRect(-8, -64, 16, 12);
    g.fillStyle = '#1e40af';
    g.fillRect(-10, -14, 8, 14);
    g.fillRect(2, -14, 8, 14);
    g.fillStyle = '#fbbf24';
    g.fillRect(-16, -50, 6, 4);
    g.fillRect(10, -50, 6, 4);
    g.restore();

    if (chatT > 0 && chatMsg) {
      var alpha = Math.min(chatT, 0.5) / 0.5;
      var panelW = 400, panelH = 50;
      var panelX = VW / 2 - panelW / 2, panelY = 20;
      g.globalAlpha = alpha * 0.85;
      g.fillStyle = chatSide === 'ally' ? '#1a3a4a' : '#3a1a1a';
      g.fillRect(panelX, panelY, panelW, panelH);
      g.strokeStyle = chatSide === 'ally' ? '#68efff' : '#ff4444';
      g.lineWidth = 2;
      g.strokeRect(panelX, panelY, panelW, panelH);
      g.fillStyle = chatSide === 'ally' ? '#68efff' : '#ff4444';
      g.font = '16px monospace';
      g.textAlign = 'center';
      g.fillText(chatMsg, VW / 2, panelY + 32);
      g.textAlign = 'left';
      g.globalAlpha = 1;
    }

    var muted = SFX.isMuted();
    g.fillStyle = muted ? '#ff0000' : '#00ff00';
    g.font = 'bold 14px monospace';
    g.fillText('SFX: ' + (muted ? 'MUTED (press M to unmute)' : 'ACTIVE'), 10, 30);

    g.fillStyle = '#aaa';
    g.font = '12px monospace';
    g.fillText('Keys: Arrows=move | Space=jump | 1-5=SFX test | M=mute toggle', 10, VH - 16);

    g.fillStyle = '#fff';
    g.font = 'bold 18px monospace';
    g.textAlign = 'center';
    g.fillText('CHAT BEEP SOUND TEST', VW / 2, VH - 36);
    g.textAlign = 'left';
  }

  function loop(now) {
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('click', function () {
    if (SFX.unlock) SFX.unlock();
    log('Audio context unlocked (click)', 'log-sfx');
  });

  log('=== CHAT BEEP DIAGNOSTIC ===');
  log('Click canvas first to unlock audio context.');
  log('Chat auto-triggers every 4-8s. Press M to toggle mute.');
  log('Keys 1-5 test individual SFX. Check SFX state at top-left of canvas.');
  log('');

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
